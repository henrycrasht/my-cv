<!-- Personality Modal -->
<template id="modal-skill-card-1-template">
  <section class="modal" id="modal-skill-card-1" aria-hidden="true" aria-label="Personality modal" role="dialog">
    <div class="modal-box" role="document">
      <header class="modal-head">
        <button class="modal-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3 class="modal-title"><i class="fa-solid fa-microchip"></i> How I'm wired</h3>
        <div class="modal-meta" aria-label="my values">
          <span class="chip"><i class="fa-solid fa-rocket"></i>AMBITION</span>
          <span class="chip"><i class="fa-solid fa-shield-heart"></i>LOYALTY</span>
          <span class="chip"><i class="fa-solid fa-heart"></i>CARE</span>
        </div>
      </header>
      <div class="modal-body">
        <div class="bullets">
          <div class="bullet">
            <i class="fa-solid fa-bolt"></i>
            <p><strong>Decisive under ambiguity:</strong> I don't wait for perfect information. I make calls, communicate clearly, and adjust fast — the operating rhythm a lean CODIR needs.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-earth-europe"></i>
            <p><strong>Built for complexity:</strong> Lived and operated across Europe, Africa, and the Middle East. I navigate cultural, legal, and organisational diversity without slowing down.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-layer-group"></i>
            <p><strong>I build the machine, then hand it over:</strong> Processes I design are meant to outlive my direct involvement — documented, tooled, and owned by the team.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-people-group"></i>
            <p><strong>I grow the people around me:</strong> I coach rather than do. Whether it's a Partnership Manager or a cross-functional squad, I invest in making people more autonomous, not more dependent.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-compass"></i>
            <p><strong>Full accountability, no excuses:</strong> P&L, headcount, vendor relationships, board reporting — I take ownership of outcomes end-to-end and make the hard calls when needed.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</template>

<!-- Fit Modal -->
<template id="modal-skill-card-2-template">
  <section class="modal" id="modal-skill-card-2" aria-hidden="true" aria-label="why fit modal" role="dialog">
    <div class="modal-box" role="document">
      <header class="modal-head">
        <button class="modal-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3 class="modal-title"><i class="fa-solid fa-handshake"></i> The operator Bankin' needs — <span class="dynamic-company-inline">...</span></h3>
        <div class="modal-sub">CEO right-hand, revenue builder, and execution backbone — all in one role.</div>
      </header>
      <div class="modal-body">
        <div class="bullets">
          <div class="bullet">
            <i class="fa-solid fa-chart-line"></i>
            <p><strong>Partnership revenue is my terrain:</strong> At Malt I owned the entire supply-side funnel — acquisition, activation, retention — for 400K+ freelancers across 7 countries. That's the exact partnership ops muscle Bankin' needs to scale its B2B and white-label revenue streams.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-bullseye"></i>
            <p><strong>OKR & performance rituals from scratch:</strong> I deployed Salesforce + Looker at Malt to create a shared performance language across Europe. I'll do the same for Bankin's CODIR cadence — OKRs, dashboards, and weekly execution rhythm, all aligned.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-user-tie"></i>
            <p><strong>I've been the founder's operator:</strong> As Deputy CEO at Gadimat I ran P&L, production, logistics, BD, and HR in direct tandem with the founder. CEO adjacency isn't new territory — it's where I naturally operate.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-project-diagram"></i>
            <p><strong>Cross-functional delivery is my default:</strong> From launching 15 country operations at Teleperformance to redesigning a global support department at Meero in 12 months, I lead complex, multi-stakeholder projects to completion without drama.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-coins"></i>
            <p><strong>Financial steering without being an accountant:</strong> I've managed €7M+ OPEX, cut costs by 11% YoY, and owned cash flow and accounting relationships. I'll hold Bankin's budget with rigour and keep the CEO focused on growth, not admin.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</template>




<script>
  fetch('../shared/cv-body.html')
    .then(response => response.text())
    .then(html => {
      document.getElementById('app').innerHTML = html;

      // 1. SELECT TEMPLATES
      const card1Template  = document.getElementById('skill-card-1');
      const card2Template  = document.getElementById('skill-card-2');
      const modal1Template = document.getElementById('modal-skill-card-1-template');
      const modal2Template = document.getElementById('modal-skill-card-2-template');

      // 2. SELECT PLACEHOLDERS
      const placeholder1 = document.querySelector('[data-placeholder="skill-card-1"]');
      const placeholder2 = document.querySelector('[data-placeholder="skill-card-2"]');

      // 3. INJECT CARDS
      if (placeholder1 && card1Template) placeholder1.replaceWith(card1Template.content.cloneNode(true));
      if (placeholder2 && card2Template) placeholder2.replaceWith(card2Template.content.cloneNode(true));

      // 4. INJECT MODALS TO BODY
      if (modal1Template) document.body.appendChild(modal1Template.content.cloneNode(true));
      if (modal2Template) document.body.appendChild(modal2Template.content.cloneNode(true));

      // 5. DYNAMIC HERO TEXT
      const heroPersonalityText = document.getElementById('hero-text-personality');
      if (heroPersonalityText && card1Template) {
        const card1Title = card1Template.content.querySelector('h3');
        if (card1Title) {
          heroPersonalityText.textContent = card1Title.textContent.trim();
        }
      }

         // 6. LOAD MAIN.JS
   const script = document.createElement('script');
   script.src = '../js/main.js';

        script.onload = function () {
        // 7. LOCAL BRAND OVERRIDE FOR THIS PAGE
        const proper = "Bankin'";

        const idEl = document.getElementById("dynamic-company-name");
        if (idEl) idEl.textContent = proper;

        document.querySelectorAll(".dynamic-company-inline").forEach(el => {
          el.textContent = proper;
        });

        const mobileLabel = document.getElementById("mobile-topbar-label");
        if (mobileLabel) {
          mobileLabel.textContent = `Josselin @ ${proper}`;
        }
      };



   document.body.appendChild(script);
    });
</script>

</body>
