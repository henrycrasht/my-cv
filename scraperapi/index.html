<!-- Personality Modal -->
<template id="modal-skill-card-1-template">
  <section class="modal" id="modal-skill-card-1" aria-hidden="true" aria-label="Personality modal" role="dialog">
    <div class="modal-box" role="document">
      <header class="modal-head">
        <button class="modal-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3 class="modal-title"><i class="fa-solid fa-sitemap"></i> Systems-Minded Operator</h3>
        <div class="modal-meta" aria-label="my values">
          <span class="chip"><i class="fa-solid fa-rocket"></i>Ambition</span>
          <span class="chip"><i class="fa-solid fa-magnifying-glass"></i>Curiosity</span>
          <span class="chip"><i class="fa-solid fa-heart"></i>Care</span>
        </div>
      </header>
      <div class="modal-body">
        <div class="bullets">
          <div class="bullet">
            <i class="fa-solid fa-brain"></i>
            <p><strong>Think in systems:</strong> I quickly map how data, teams, and processes connect, then design lean operating models that people actually use day to day.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-earth-europe"></i>
            <p><strong>Global & async by default:</strong> Years across Europe and Africa taught me to run distributed teams with clear written context instead of heavy meeting culture.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-puzzle-piece"></i>
            <p><strong>Thrive in complexity:</strong> I enjoy untangling ambiguous, cross-functional problems and turning them into clear, shared playbooks with measurable outcomes for everyone.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-people-group"></i>
            <p><strong>Team-first & pedagogical:</strong> I explain the “why”, align incentives, and give people ownership so they can grow and perform inside the structure we build.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-satellite-dish"></i>
            <p><strong>Tech-friendly operator:</strong> I’m comfortable around APIs, dashboards, and tools, and focus on solutions that work reliably in production, not just on slides.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</template>

<!-- Fit Modal -->
<template id="modal-skill-card-2-template">
  <section class="modal" id="modal-skill-card-2" aria-hidden="true" aria-label="why fit modal" role="dialog">
    <div class="modal-box" role="document">
      <header class="modal-head">
        <button class="modal-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3 class="modal-title"><i class="fa-solid fa-gears"></i> Why I fit @<span class="dynamic-company-inline">...</span></h3>
        <div class="modal-sub">From messy merger to one clear, scalable operating system for ScraperAPI.</div>
      </header>
      <div class="modal-body">
        <div class="bullets">
          <div class="bullet">
            <i class="fa-solid fa-table-columns"></i>
            <p><strong>Unifying metrics after big changes:</strong> At TLScontact I redesigned KPIs after a huge UK RFP win so new and legacy contracts could be managed under one fair, comparable performance model.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-chart-line"></i>
            <p><strong>Data foundations:</strong> At Meero and Malt I fixed definitions and pipelines before scaling reporting, giving leadership a single source of truth for decisions.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-compass"></i>
            <p><strong>Remote-friendly operating cadence:</strong> I have led multi-country teams on structured rhythms (targets, reviews, feedback loops) that keep momentum high without adding bureaucracy.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-coins"></i>
            <p><strong>Ops that move revenue:</strong> From cutting global support costs by 80% to aligning incentives with upsell, I consistently link operational changes to clear commercial outcomes.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-gears"></i>
            <p><strong>Bridge between engineers and business:</strong> I’m used to working closely with technical teams, and I’m eager to go deep on how ScraperAPI’s web scraping stack works so pricing, KPIs, and SLAs reflect real-world constraints and opportunities.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</template>



<script>
  fetch('../shared/cv-body.html')
    .then(response => response.text())
    .then(html => {
      document.getElementById('app').innerHTML = html;

      // 1. SELECT TEMPLATES
      const card1Template  = document.getElementById('skill-card-1');
      const card2Template  = document.getElementById('skill-card-2');
      const modal1Template = document.getElementById('modal-skill-card-1-template');
      const modal2Template = document.getElementById('modal-skill-card-2-template');

      // 2. SELECT PLACEHOLDERS
      const placeholder1 = document.querySelector('[data-placeholder="skill-card-1"]');
      const placeholder2 = document.querySelector('[data-placeholder="skill-card-2"]');

      // 3. INJECT CARDS
      if (placeholder1 && card1Template) placeholder1.replaceWith(card1Template.content.cloneNode(true));
      if (placeholder2 && card2Template) placeholder2.replaceWith(card2Template.content.cloneNode(true));

      // 4. INJECT MODALS TO BODY
      if (modal1Template) document.body.appendChild(modal1Template.content.cloneNode(true));
      if (modal2Template) document.body.appendChild(modal2Template.content.cloneNode(true));

      // 5. DYNAMIC HERO TEXT
      const heroPersonalityText = document.getElementById('hero-text-personality');
      if (heroPersonalityText && card1Template) {
        const card1Title = card1Template.content.querySelector('h3');
        if (card1Title) {
          heroPersonalityText.textContent = card1Title.textContent.trim();
        }
      }

         // 6. LOAD MAIN.JS
   const script = document.createElement('script');
   script.src = '../js/main.js';

        script.onload = function () {
        // 7. LOCAL BRAND OVERRIDE FOR THIS PAGE
        const proper = "ScraperAPI";

        const idEl = document.getElementById("dynamic-company-name");
        if (idEl) idEl.textContent = proper;

        document.querySelectorAll(".dynamic-company-inline").forEach(el => {
          el.textContent = proper;
        });

        const mobileLabel = document.getElementById("mobile-topbar-label");
        if (mobileLabel) {
          mobileLabel.textContent = `Josselin @ ${proper}`;
        }
      };



   document.body.appendChild(script);
    });
</script>

</body>
