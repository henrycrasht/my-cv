        <div class="modal-meta" aria-label="my values">

          <span class="chip"><i class="fa-solid fa-handshake"></i>Loyalty</span>
          <span class="chip"><i class="fa-solid fa-heart"></i>Care</span>
        </div>
      </header>
      <div class="modal-body">
        <div class="bullets">
          <div class="bullet">
            <i class="fa-solid fa-globe"></i>
            <p><strong>Global, curious mindset:</strong> 15+ sites launched across Africa and global teams in Europe, US and Asia; I’m comfortable aligning multicultural stakeholders around a shared execution plan.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-gears"></i>
            <p><strong>Builder more than talker:</strong> I enjoy turning vision decks into playbooks, processes and dashboards that teams can actually use in the field.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-bolt"></i>

          </div>

          </div>
          <div class="bullet">
            <i class="fa-solid fa-chalkboard-user"></i>
            <p><strong>Pedagogical & transparent:</strong> I explain the “why”, not just the “what”, so that teams across BUs and geographies understand trade-offs and stay aligned on Antimatter’s mission.</p>

        </div>
      </div>
    </div>
  </section>
</template>

<!-- Fit Modal -->

            <i class="fa-solid fa-file"></i> Download my Antimatter execution memo (PDF)

          </div>
          <div class="bullet">
            <i class="fa-solid fa-earth-europe"></i>

          </div>
          <div class="bullet">
            <i class="fa-solid fa-bullseye"></i>
            <p><strong>Customer-grade reliability:</strong> After leading global support and community ops at Meero and Malt, I know how to design SLAs, incident flows and feedback loops so HPC/AI clients experience Antimatter as dependable as a hyperscaler.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-puzzle-piece"></i>
            <p><strong>Glue between BUs and execs:</strong> I’m comfortable acting as a senior operator across Data Factory, PoliCloud and Hivenet, aligning deployment, finance and product roadmaps while surfacing field reality to the executive team.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-user-group"></i>
            <p><strong>Building the ops squad:</strong> My contribution is not to “do it all” alone, but to hire, structure and coach a small cross-functional team that can own deployments and customer operations at scale.</p>
          </div>
        </div>
      </div>
    </div>

</template>




<script>
  fetch('../shared/cv-body.html')
    .then(response => response.text())
    .then(html => {
      document.getElementById('app').innerHTML = html;

      // 1. SELECT TEMPLATES
      const card1Template  = document.getElementById('skill-card-1');
      const card2Template  = document.getElementById('skill-card-2');
      const modal1Template = document.getElementById('modal-skill-card-1-template');
      const modal2Template = document.getElementById('modal-skill-card-2-template');

      // 2. SELECT PLACEHOLDERS
      const placeholder1 = document.querySelector('[data-placeholder="skill-card-1"]');
      const placeholder2 = document.querySelector('[data-placeholder="skill-card-2"]');

      // 3. INJECT CARDS
      if (placeholder1 && card1Template) placeholder1.replaceWith(card1Template.content.cloneNode(true));
      if (placeholder2 && card2Template) placeholder2.replaceWith(card2Template.content.cloneNode(true));

      // 4. INJECT MODALS TO BODY
      if (modal1Template) document.body.appendChild(modal1Template.content.cloneNode(true));
      if (modal2Template) document.body.appendChild(modal2Template.content.cloneNode(true));

      // 5. DYNAMIC HERO TEXT
      const heroPersonalityText = document.getElementById('hero-text-personality');
      if (heroPersonalityText && card1Template) {
        const card1Title = card1Template.content.querySelector('h3');
        if (card1Title) {
          heroPersonalityText.textContent = card1Title.textContent.trim();
        }
      }

         // 6. LOAD MAIN.JS
   const script = document.createElement('script');
   script.src = '../js/main.js';

        script.onload = function () {
        // 7. LOCAL BRAND OVERRIDE FOR THIS PAGE
        const proper = "AntiMatter";

        const idEl = document.getElementById("dynamic-company-name");
        if (idEl) idEl.textContent = proper;

        document.querySelectorAll(".dynamic-company-inline").forEach(el => {
          el.textContent = proper;
        });

        const mobileLabel = document.getElementById("mobile-topbar-label");
        if (mobileLabel) {
          mobileLabel.textContent = `Josselin @ ${proper}`;
        }
      };


   document.body.appendChild(script);
    });
</script>
