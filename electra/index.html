<template id="skill-card-2">

<!-- COMPANY-SPECIFIC MODAL Hidden -->

<!-- Personality Modal -->
<template id="modal-skill-card-1-template">
  <section class="modal" id="modal-skill-card-1" aria-hidden="true" aria-label="Personality modal" role="dialog">
    <div class="modal-box" role="document">
      <header class="modal-head">
        <button class="modal-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3 class="modal-title"><i class="fa-solid fa-bolt"></i> Operator at Heart</h3>
        <div class="modal-meta" aria-label="my values">
          <span class="chip"><i class="fa-solid fa-anchor"></i>GROUNDED</span>
          <span class="chip"><i class="fa-solid fa-rocket"></i>AMBITIOUS</span>
          <span class="chip"><i class="fa-solid fa-heart"></i>PEOPLE-FIRST</span>
        </div>
      </header>
      <div class="modal-body">
        <div class="bullets">
          <div class="bullet">
            <i class="fa-solid fa-earth-africa"></i>
            <p><strong>International & curious:</strong> Lived and operated across Europe, Africa and the Middle East. I believe in blending local needs in global frameworks. Scaling Electra's Care across Europe is an exciting déjà-vu</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-fire"></i>
            <p><strong>High-ownership, low excuses:</strong> I take the brief, I own the outcome. At Meero, when costs spiraled, I didn't flag the problem. I restructured the entire operation and cut 80% of costs in 12 months.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-brain"></i>
            <p><strong>I build systems, not workarounds:</strong> Every team I've led runs on clear processes, documented playbooks, and dashboards that make performance visible in real time. Gut feel doesn't scale. Structure does.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-people-group"></i>
            <p><strong>Team-first & pedagogical:</strong> I explain the “why”, align incentives, and give people ownership so they can grow and perform inside the structure we build.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-bolt"></i>
            <p><strong>Urgency is my baseline:</strong> Whether it was an Ebola outbreak in Sierra Leone or a P&L crisis in Paris, I've always operated where waiting is not an option. That instinct doesn't switch off.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</template>

<!-- Fit Modal -->
<template id="modal-skill-card-2-template">
  <section class="modal" id="modal-skill-card-2" aria-hidden="true" aria-label="why fit modal" role="dialog">
    <div class="modal-box" role="document">
      <header class="modal-head">
        <button class="modal-close" type="button" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
        <h3 class="modal-title"><i class="fa-solid fa-plug"></i> Why <span class="dynamic-company-inline">...</span>? Why Now?</h3>
        <div class="modal-sub">Scaling support without short-circuiting the budget. I'm ready to switch that on again.</div>
      </header>
      <div class="modal-body">
        <div class="bullets">
          <div class="bullet">
            <i class="fa-solid fa-building"></i>
            <p><strong>BPO is my native language:</strong> From Teleperformance managing government-grade SLAs across 17 African countries, to running a full RFP and onboarding a BPO for 40-language outbound ops at Meero, I know how to govern outsourced operations with discipline and commercial rigor.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-sack-dollar"></i>
            <p><strong>I own the P&L, not just the metrics:</strong> At Teleperformance I managed €7M annual OPEX. At Meero I cut operational costs by 80% while maintaining quality. At Gadimat I owned the P&L of the furniture factory. Electra needs someone who sees cost and operational service as two sides of the same lever.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-tower-broadcast"></i>
            <p><strong>I've scaled care through hypergrowth before:</strong> At Meero, +400% activity in 18 months. I built the foundations, then restructured for efficiency when the curve changed. Electra is heading toward 15,000 charging points. I wanna be there when the inflection point is coming.</p>
          </div>
          <div class="bullet">
            <i class="fa-solid fa-robot"></i>
            <p><strong>Care + AI: high conviction, zero shortcuts:</strong> Across Meero, Malt and Gadimat, I've moved automations and AI from pilot to production. In support, the stakes are higher: one broken handoff and you lose a user mid-charge. I ran your Intercom flow before writing this. I spotted the dead-end immediately. I already know three ways to fix it.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
</template>



<script>
  fetch('../shared/cv-body.html')
    .then(response => response.text())
    .then(html => {
      document.getElementById('app').innerHTML = html;

      // 1. SELECT TEMPLATES
      const card1Template  = document.getElementById('skill-card-1');
      const card2Template  = document.getElementById('skill-card-2');
      const modal1Template = document.getElementById('modal-skill-card-1-template');
      const modal2Template = document.getElementById('modal-skill-card-2-template');

      // 2. SELECT PLACEHOLDERS
      const placeholder1 = document.querySelector('[data-placeholder="skill-card-1"]');
      const placeholder2 = document.querySelector('[data-placeholder="skill-card-2"]');

      // 3. INJECT CARDS
      if (placeholder1 && card1Template) placeholder1.replaceWith(card1Template.content.cloneNode(true));
      if (placeholder2 && card2Template) placeholder2.replaceWith(card2Template.content.cloneNode(true));

      // 4. INJECT MODALS TO BODY
      if (modal1Template) document.body.appendChild(modal1Template.content.cloneNode(true));
      if (modal2Template) document.body.appendChild(modal2Template.content.cloneNode(true));

      // 5. DYNAMIC HERO TEXT
      const heroPersonalityText = document.getElementById('hero-text-personality');
      if (heroPersonalityText && card1Template) {
        const card1Title = card1Template.content.querySelector('h3');
        if (card1Title) {
          heroPersonalityText.textContent = card1Title.textContent.trim();
        }
      }

         // 6. LOAD MAIN.JS
   const script = document.createElement('script');
   script.src = '../js/main.js';

        script.onload = function () {
        // 7. LOCAL BRAND OVERRIDE FOR THIS PAGE
        const proper = "Electra";

        const idEl = document.getElementById("dynamic-company-name");
        if (idEl) idEl.textContent = proper;

        document.querySelectorAll(".dynamic-company-inline").forEach(el => {
          el.textContent = proper;
        });

        const mobileLabel = document.getElementById("mobile-topbar-label");
        if (mobileLabel) {
          mobileLabel.textContent = `Josselin @ ${proper}`;
        }
      };



   document.body.appendChild(script);
    });
</script>

</body>
</html>
